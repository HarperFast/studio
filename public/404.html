<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Page Not Found — Harper Fabric</title>
    <link rel="icon" type="image/svg+xml" href="/HDBDogOnly.svg" />
    <link rel="icon" type="dynamic-favicon" href="/favicon_purple.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <!-- Self-contained on purpose: this page is served when a URL matched nothing, so it must not
         depend on a hashed bundle, a stylesheet, or a font that might itself be the thing missing. -->
    <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      align-items: center;
      background: linear-gradient(45deg, #312556, #403b8a, #7a3a87);
      box-sizing: border-box;
      color: #efefef;
      display: flex;
      font-family: helvetica, sans-serif;
      justify-content: center;
      line-height: 1.5;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    main {
      max-width: 30rem;
      text-align: center;
    }

    img {
      height: 84px;
      width: 84px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 400;
      margin: 1.5rem 0 0.75rem;
    }

    p {
      color: hsl(0, 0%, 85%);
    }

    a {
      background-color: hsla(0, 0%, 0%, 0.35);
      border-radius: 0.375rem;
      color: #fff;
      display: inline-block;
      margin-top: 1.75rem;
      padding: 0.625rem 1.25rem;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background-color: hsla(0, 0%, 0%, 0.6);
    }
    </style>
  </head>

  <body>
    <main>
      <img src="/HDBDogOnly.svg" alt="" width="84" height="84" />
      <h1>Page not found</h1>
      <p>
        That address isn't part of Harper Fabric. If you followed a link from
        outside Studio, it may have pointed somewhere that has since moved.
      </p>
      <a href="/">Go to Harper Fabric</a>
    </main>
  </body>
</html>
