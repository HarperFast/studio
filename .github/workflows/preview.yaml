name: Preview

# Runs from stage with the cluster's preview identity, so nothing here may check out or run a PR's
# code: preview-build.yaml builds it unprivileged, and this deploys only its `web/`. The cluster
# trusts this file by path, branch, event and environment (`harper preview setup app=hdbms
# dataMode=shared`, which `branched_databases: false` below needs). See
# .github/deploying.md and https://github.com/HarperFast/deploy-action#pull-request-previews

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
    # Keep the same as in preview-build.yaml.
    branches: [stage]

permissions: {}

jobs:
  deploy:
    # A preview's JavaScript runs with its visitor's dev CM session, so it deploys only for a PR a
    # listed user opened, on an event a listed user caused. HARPER_PREVIEW_AUTHORS is a JSON array of
    # GitHub logins; unset, nobody gets a preview.
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(fromJSON(vars.HARPER_PREVIEW_AUTHORS || '[]'), github.event.pull_request.user.login)
      && contains(fromJSON(vars.HARPER_PREVIEW_AUTHORS || '[]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: preview
    permissions:
      id-token: write
      pull-requests: write
      deployments: write
      # Reading preview-build.yaml's runs and downloading their artifacts.
      actions: read
    concurrency:
      group: harper-preview-${{ github.event.pull_request.number }}
    steps:
      # GitHub starts both workflows at once, and the trust policy matches only pull_request_target
      # runs, so a workflow_run trigger cannot deploy: this job waits for the build itself. Another
      # PR can have a run at the same commit, so the run's title has to name this one.
      - name: Wait for the build of this commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          # preview-build.yaml's run-name.
          BUILD_TITLE: 'Build PR Preview #${{ github.event.pull_request.number }}'
          BUILD_WORKFLOW: preview-build.yaml
        run: |
          short=${SHA:0:7}
          superseded() {
            local pr state head
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.state + " " + .head.sha') || return 1
            read -r state head <<<"$pr"
            [ "$state" = open ] && [ "$head" = "$SHA" ] && return 1
            echo "::notice::Not deploying $short: PR #$PR is $state at ${head:0:7}."
          }
          start=$SECONDS
          while :; do
            if superseded; then exit 0; fi
            listed=1
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$BUILD_WORKFLOW/runs?event=pull_request&head_sha=$SHA" \
              --jq '[.workflow_runs[] | select(.head_repository.full_name == env.GITHUB_REPOSITORY and .display_title == env.BUILD_TITLE)] | max_by(.run_number) | select(.) | "\(.id) \(.status) \(.conclusion)"') || { listed=0; run=; }
            elapsed=$((SECONDS - start))
            if [ -n "$run" ]; then
              read -r id status conclusion <<<"$run"
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "Deploying the build from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
                  echo "run-id=$id" >>"$GITHUB_OUTPUT"
                  exit 0
                fi
                if superseded; then exit 0; fi
                echo "::error::The build of $short ended $conclusion: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
                exit 1
              fi
            # A failed listing is not evidence that no run started.
            elif [ "$listed" = 1 ] && [ "$elapsed" -ge 600 ]; then
              echo "::error::No $BUILD_WORKFLOW run for $short started in 10 minutes. GitHub starts no pull_request run while a PR has merge conflicts."
              exit 1
            fi
            if [ "$elapsed" -ge 1800 ]; then
              echo "::error::The build of $short did not finish in 30 minutes."
              exit 1
            fi
            sleep 20
          done

      - name: Download the build
        if: steps.build.outputs.run-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-${{ github.event.pull_request.number }}-build
          path: site/web
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}

      # Written here, outside the artifact, so the PR controls only files the static plugin serves.
      - name: Serve the build as a Harper application
        if: steps.build.outputs.run-id != ''
        run: |
          cat > site/config.yaml << 'EOF'
          static:
            files: 'web/**'
            urlPath: '/'
            index: true
          EOF

      - if: steps.build.outputs.run-id != ''
        uses: HarperFast/deploy-action@45fa59b6157eabb72b7a74922309238671f2a37d # v1.0.0
        with:
          target: ${{ vars.HARPER_PREVIEW_TARGET }}
          app: hdbms
          preview: true
          by_ref: false
          path: site
          # Branching forks every database on the node but `system`, CM's own included. The payload
          # runs no server code, so it touches no data.
          branched_databases: false

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview-cleanup
    permissions:
      id-token: write
      pull-requests: write
      deployments: write
    steps:
      # Gated here, not on the job: `harper preview setup` can only verify that cleanup runs on close
      # when the job's `if:` has nothing else in it. The author alone, so whoever merges, cleans up.
      - if: >-
          vars.HARPER_PREVIEW_TARGET != ''
          && contains(fromJSON(vars.HARPER_PREVIEW_AUTHORS || '[]'), github.event.pull_request.user.login)
        uses: HarperFast/deploy-action@45fa59b6157eabb72b7a74922309238671f2a37d # v1.0.0
        with:
          target: ${{ vars.HARPER_PREVIEW_TARGET }}
          app: hdbms
          preview: true
