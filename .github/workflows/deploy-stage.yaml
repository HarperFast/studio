name: Deploy to Stage
on:
  # Pushes to `stage` cut a release and deploy with the defaults below (Harper 4.x
  # template, no restart). Use the manual run to override either — see
  # .github/deploy-templates.md. `merge_group` runs verify only: no release, no deploy.
  workflow_dispatch:
    inputs:
      restart:
        description: 'Restart the component after deploying'
        type: boolean
        default: false
      harper_version:
        description: 'Harper major version running on the target CM (picks the deploy template)'
        type: choice
        default: v4
        options:
          - v4
          - v5
  push:
    branches:
      - stage
  merge_group:
    branches:
      - stage

concurrency:
  group: stage-${{ github.event_name }}-${{ github.ref || github.head_ref }}
  # Only merge-queue verification runs are disposable; a push or a manual run deploys.
  cancel-in-progress: ${{ github.event_name == 'merge_group' }}

jobs:
  deployToStage:
    name: Deploy to Stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          node-version-file: '.nvmrc'
      - name: Disable Husky
        run: echo "HUSKY=0" >> $GITHUB_ENV
      - name: Install dependencies
        run: pnpm install
      - name: Run unit tests
        run: pnpm test
      - name: Run lint
        run: pnpm lint
      # Deliberately ahead of the release step and unconditional: a push that cannot
      # build must fail before `pnpm release` tags a version nothing can ship.
      - name: Verify stage can build
        run: pnpm build --mode stage
      - name: Semantic release
        if: ${{ github.event_name == 'push' }}
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine version tag for build
        if: ${{ github.event_name != 'merge_group' }}
        run: |
          VERSION_TAG=$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1)
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="stage_${GITHUB_SHA:0:7}"
          fi
          echo "VITE_STUDIO_VERSION=$VERSION_TAG" >> $GITHUB_ENV
      - name: Build stage for release
        if: ${{ github.event_name != 'merge_group' }}
        run: pnpm build --mode stage
      - name: Upload sourcemaps to Datadog
        if: ${{ github.event_name != 'merge_group' }}
        run: |
          pnpm datadog-ci sourcemaps upload web/assets \
            --service "studio" \
            --release-version "$VITE_STUDIO_VERSION" \
            --minified-path-prefix "https://stage.studio.harperfabric.com/assets"
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
      # Datadog now holds the maps and is their only consumer. They are 76% of the build output
      # (~71 MB, mostly `sourcesContent`), so shipping them too would replicate that to every
      # node for nothing. See `sourcemapFor` in vite.config.ts, which emits these as `'hidden'`
      # so no bundle references the files deleted here.
      - name: Strip sourcemaps from the deployed bundle
        if: ${{ github.event_name != 'merge_group' }}
        run: find web/assets -name '*.js.map' -delete
      # `inputs.*` is empty for anything but a manual run, and anything that is not
      # exactly `true`/`v5` falls back to the safe default, so a push deploys the
      # Harper 4.x template without restarting.
      - name: Resolve deploy options
        if: ${{ github.event_name != 'merge_group' }}
        env:
          RESTART_INPUT: ${{ inputs.restart }}
          HARPER_INPUT: ${{ inputs.harper_version }}
        run: |
          RESTART=false
          TEMPLATE=.github/deploy-template
          if [ "$RESTART_INPUT" = 'true' ]; then
            RESTART=true
          fi
          if [ "$HARPER_INPUT" = 'v5' ]; then
            TEMPLATE=.github/deploy-template-v5
          fi
          echo "DEPLOY_RESTART=$RESTART" >> "$GITHUB_ENV"
          echo "DEPLOY_TEMPLATE=$TEMPLATE" >> "$GITHUB_ENV"
          echo "Deploying $TEMPLATE with restart=$RESTART"
      - name: Deploy to stage
        if: ${{ github.event_name != 'merge_group' }}
        run: |
          mkdir deploy
          mv web deploy/
          cp -R "$DEPLOY_TEMPLATE"/* deploy/
          cd deploy
          CLI_TARGET_USERNAME=${{ secrets.CLI_TARGET_USERNAME }} CLI_TARGET_PASSWORD='${{ secrets.HARPERDB_CLI_TARGET_PASSWORD }}' pnpm harper deploy_component project=hdbms target='${{ secrets.CLI_DEPLOY_TARGET }}' restart="$DEPLOY_RESTART" replicated=true
