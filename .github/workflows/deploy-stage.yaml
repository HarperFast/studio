name: Deploy to Stage
on:
  workflow_dispatch:
    inputs:
      restart:
        description: 'Restart the component after deploying'
        type: boolean
        default: false
      harper_version:
        description: 'Harper major version running on the target CM'
        type: choice
        default: v5
        options:
          - v4
          - v5
  push:
    branches:
      - stage

concurrency:
  # Both remaining events deploy, so they share one group and never cancel each other: a push
  # and a manual run must not reach `deploy_component` at once, and cancelling mid-deploy is
  # worse than queueing behind one. dev and prod behave the same way.
  group: stage-deploy
  cancel-in-progress: false

jobs:
  deployToStage:
    name: Deploy to Stage
    runs-on: ubuntu-latest
    permissions:
      # semantic-release pushes the tag and the GitHub release. Safe to hold at job scope only
      # because every event this workflow accepts is trusted — see the `merge_group` note in
      # .github/deploying.md before adding a trigger here.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # Only semantic-release needs the token, and it runs on push alone; anywhere else it
          # would just sit in `.git/config` for the rest of the job.
          persist-credentials: ${{ github.event_name == 'push' }}
      - name: Verify
        uses: ./.github/actions/studio-verify
        with:
          environment: stage
          # A releasing push must fail before `pnpm release` tags a version nothing can ship.
          # A manual run does not release, so it skips this and builds once, in the deploy step.
          build: ${{ github.event_name == 'push' }}
      - name: Build and deploy
        uses: ./.github/actions/studio-deploy
        with:
          environment: stage
          sourcemap-url-prefix: https://stage.studio.harperfabric.com/assets
          release: ${{ github.event_name == 'push' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # This literal, not the dispatch input, is what the CM runs — .github/deploying.md.
          harper-version: ${{ inputs.harper_version || 'v5' }}
          restart: ${{ inputs.restart || false }}
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
          cli-target-username: ${{ secrets.CLI_TARGET_USERNAME }}
          cli-target-password: ${{ secrets.HARPERDB_CLI_TARGET_PASSWORD }}
          cli-deploy-target: ${{ secrets.CLI_DEPLOY_TARGET }}
