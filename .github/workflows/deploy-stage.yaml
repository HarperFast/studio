name: Deploy to Stage
on:
  workflow_dispatch:
    inputs:
      restart:
        description: 'Restart the component after deploying'
        type: boolean
        default: false
      harper_version:
        description: 'Harper major version running on the target CM'
        type: choice
        default: v5
        options:
          - v4
          - v5
  push:
    branches:
      - stage

concurrency:
  # Both events deploy, so they share a group: two `deploy_component` calls must never overlap.
  # `false` protects the run in flight only — GitHub keeps a single pending slot per group, so a
  # third run displaces a queued second one. Harmless between two pushes (the survivor's ref
  # already contains the skipped commits) but *not* when the displaced run is a manual one: a
  # major switch only happens via dispatch, and the replacement push deploys `restart: false`, so
  # the new range lands on disk unused and breaks at the next worker respawn instead. Re-run the
  # dispatch if a queued manual deploy shows as cancelled.
  group: stage-deploy
  cancel-in-progress: false

jobs:
  deployToStage:
    name: Deploy to Stage
    runs-on: ubuntu-latest
    permissions:
      # semantic-release pushes the tag and the GitHub release. Safe to hold at job scope only
      # because every event this workflow accepts is trusted — see the `merge_group` note in
      # .github/deploying.md before adding a trigger here.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # semantic-release is the only consumer, and it runs on push alone.
          persist-credentials: ${{ github.event_name == 'push' }}
      - name: Verify
        uses: ./.github/actions/studio-verify
        with:
          environment: stage
          # A releasing push must fail before `pnpm release` tags a version nothing can ship.
          # A manual run does not release, so it skips this and builds once, in the deploy step.
          build: ${{ github.event_name == 'push' }}
      - name: Build and deploy
        uses: ./.github/actions/studio-deploy
        with:
          environment: stage
          sourcemap-url-prefix: https://stage.studio.harperfabric.com/assets
          release: ${{ github.event_name == 'push' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # This literal, not the dispatch input, is what the CM runs — .github/deploying.md.
          harper-version: ${{ inputs.harper_version || 'v5' }}
          restart: ${{ inputs.restart || false }}
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
          cli-target-username: ${{ secrets.CLI_TARGET_USERNAME }}
          cli-target-password: ${{ secrets.HARPERDB_CLI_TARGET_PASSWORD }}
          cli-deploy-target: ${{ secrets.CLI_DEPLOY_TARGET }}
