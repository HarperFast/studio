name: Deploy to Stage
on:
  workflow_dispatch:
    inputs:
      restart:
        description: 'Restart the component after deploying'
        type: boolean
        default: false
      harper_version:
        description: 'Harper major version running on the target CM'
        type: choice
        default: v4
        options:
          - v4
          - v5
  push:
    branches:
      - stage
  merge_group:
    branches:
      - stage

concurrency:
  # Every deploying run shares one group, so a push and a manual run cannot both reach
  # `deploy_component` at once — dev and prod already behave this way. Merge-queue runs stay
  # per-ref, and are the only ones safe to cancel: cancelling mid-deploy is worse than queueing.
  group: stage-${{ github.event_name == 'merge_group' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'merge_group' }}

jobs:
  deployToStage:
    name: Deploy to Stage
    runs-on: ubuntu-latest
    permissions:
      # semantic-release pushes the tag and the GitHub release.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # Checkout otherwise leaves the job's write-capable token in `.git/config` as an
          # http.extraheader, and a merge-queue run then executes PR-controlled `pnpm test`
          # over it — which could push to `stage` and reach the credentialed push path. Only
          # semantic-release needs it, and that runs on push alone.
          persist-credentials: ${{ github.event_name == 'push' }}
      - name: Verify
        uses: ./.github/actions/studio-verify
        with:
          environment: stage
          # A merge-queue run has no later build, and a releasing push must fail before the tag.
          build: ${{ github.event_name != 'workflow_dispatch' }}
      # Skipped outright on a merge-queue run, which is what keeps the five deploy secrets away
      # from an unmerged PR's code. It does not make the job safe on its own: `contents: write`
      # spans every event, so candidate YAML can still read `github.token` directly. Closing
      # that needs the release moved to its own job — see .github/deploying.md.
      - name: Build and deploy
        if: ${{ github.event_name != 'merge_group' }}
        uses: ./.github/actions/studio-deploy
        with:
          environment: stage
          sourcemap-url-prefix: https://stage.studio.harperfabric.com/assets
          release: ${{ github.event_name == 'push' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # This literal, not the dispatch input, is what the CM runs — .github/deploying.md.
          harper-version: ${{ inputs.harper_version || 'v4' }}
          restart: ${{ inputs.restart || false }}
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
          cli-target-username: ${{ secrets.CLI_TARGET_USERNAME }}
          cli-target-password: ${{ secrets.HARPERDB_CLI_TARGET_PASSWORD }}
          cli-deploy-target: ${{ secrets.CLI_DEPLOY_TARGET }}
