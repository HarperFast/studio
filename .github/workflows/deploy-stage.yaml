name: Deploy to Stage
on:
  workflow_dispatch:
  push:
    branches:
      - stage
  merge_group:
    branches:
      - stage

concurrency:
  group: stage-${{ github.event_name }}-${{ github.ref || github.head_ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  deployToStage:
    name: Deploy to Stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          node-version-file: '.nvmrc'
      - name: Disable Husky
        run: echo "HUSKY=0" >> $GITHUB_ENV
      - name: Install dependencies
        run: pnpm install
      - name: Run unit tests
        run: pnpm test
      - name: Run lint
        run: pnpm lint
      - name: Verify stage can build
        run: pnpm build --mode stage
      - name: Semantic release
        if: ${{ github.event_name == 'push' }}
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine version tag for build
        if: ${{ github.event_name == 'push' }}
        run: |
          VERSION_TAG=$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1)
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="stage_${GITHUB_SHA:0:7}"
          fi
          echo "VITE_STUDIO_VERSION=$VERSION_TAG" >> $GITHUB_ENV
      - name: Build stage for release
        if: ${{ github.event_name == 'push' }}
        run: pnpm build --mode stage
      - name: Upload sourcemaps to Datadog
        if: ${{ github.event_name == 'push' }}
        run: |
          pnpm datadog-ci sourcemaps upload web/assets \
            --service "studio" \
            --release-version "$VITE_STUDIO_VERSION" \
            --minified-path-prefix "https://stage.studio.harperfabric.com/assets"
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
      - name: Deploy to stage
        if: ${{ github.event_name == 'push' }}
        run: |
          mkdir deploy
          mv web deploy/
          cp -R .github/deploy-template/* deploy/
          cd deploy
          CLI_TARGET_USERNAME=${{ secrets.CLI_TARGET_USERNAME }} CLI_TARGET_PASSWORD='${{ secrets.HARPERDB_CLI_TARGET_PASSWORD }}' pnpm harper deploy_component project=hdbms target='${{ secrets.CLI_DEPLOY_TARGET }}' restart=false replicated=true
