name: Deploy to Stage
on:
  # Pushes to `stage` cut a release and deploy with the defaults below (Harper 4.x, no
  # restart). Use the manual run to override either — see .github/deploying.md.
  # `merge_group` runs the tests and a build only: no release, no deploy.
  workflow_dispatch:
    inputs:
      restart:
        description: 'Restart the component after deploying'
        type: boolean
        default: false
      harper_version:
        description: 'Harper major version running on the target CM'
        type: choice
        default: v4
        options:
          - v4
          - v5
  push:
    branches:
      - stage
  merge_group:
    branches:
      - stage

concurrency:
  group: stage-${{ github.event_name }}-${{ github.ref || github.head_ref }}
  # Only merge-queue verification runs are disposable; a push or a manual run deploys.
  cancel-in-progress: ${{ github.event_name == 'merge_group' }}

jobs:
  deployToStage:
    name: Deploy to Stage
    runs-on: ubuntu-latest
    permissions:
      # semantic-release pushes the tag and the GitHub release.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      # Everything past the checkout is shared with the other environments — see
      # .github/actions/deploy-studio/action.yaml.
      - name: Build and deploy
        uses: ./.github/actions/deploy-studio
        with:
          environment: stage
          sourcemap-url-prefix: https://stage.studio.harperfabric.com/assets
          # A merge-queue run verifies the merged combination without shipping it, and only
          # a push is allowed to cut a version — a manual run redeploys, it does not release.
          deploy: ${{ github.event_name != 'merge_group' }}
          release: ${{ github.event_name == 'push' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # `inputs.*` is empty outside a manual run, which lands on the action's defaults.
          restart: ${{ inputs.restart }}
          harper-version: ${{ inputs.harper_version }}
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
          cli-target-username: ${{ secrets.CLI_TARGET_USERNAME }}
          cli-target-password: ${{ secrets.HARPERDB_CLI_TARGET_PASSWORD }}
          cli-deploy-target: ${{ secrets.CLI_DEPLOY_TARGET }}
