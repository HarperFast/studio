name: Verify Fabric PR
on:
  workflow_dispatch:
  pull_request:
    branches: [harper/fabric]
jobs:
  verifyFabricPR:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install
      - name: Run unit tests
        run: pnpm test
      - name: Run lint
        run: pnpm lint
      - name: Build
        run: pnpm build
