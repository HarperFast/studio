name: Deploy to Dev
on:
  workflow_dispatch:
    inputs:
      restart:
        description: 'Restart the component after deploying'
        type: boolean
        default: false
      harper_version:
        description: 'Harper major version running on the target CM'
        type: choice
        default: v4
        options:
          - v4
          - v5
  push:
    branches:
      - dev

concurrency:
  group: dev
  cancel-in-progress: false

jobs:
  deployToDev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # Nothing here pushes; don't leave the token in `.git/config`.
          persist-credentials: false
      - name: Verify
        uses: ./.github/actions/studio-verify
        with:
          environment: dev
      - name: Build and deploy
        uses: ./.github/actions/studio-deploy
        with:
          environment: dev
          sourcemap-url-prefix: https://dev.studio.harperfabric.com/assets
          # This literal, not the dispatch input, is what the CM runs — .github/deploying.md.
          harper-version: ${{ inputs.harper_version || 'v4' }}
          restart: ${{ inputs.restart || false }}
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
          cli-target-username: ${{ secrets.CLI_TARGET_USERNAME_DEV }}
          cli-target-password: ${{ secrets.HARPERDB_CLI_TARGET_PASSWORD_DEV }}
          cli-deploy-target: ${{ secrets.CLI_DEPLOY_TARGET_DEV }}
