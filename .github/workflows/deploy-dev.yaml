name: Deploy to Dev
on:
  workflow_dispatch:
    inputs:
      restart:
        description: 'Restart the component after deploying'
        type: boolean
        default: false
      harper_version:
        description: 'Harper major version running on the target CM'
        type: choice
        default: v5
        options:
          - v4
          - v5
  push:
    branches:
      - dev

concurrency:
  group: dev
  cancel-in-progress: false

jobs:
  deployToDev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.deploy.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # Nothing here pushes; don't leave the token in `.git/config`.
          persist-credentials: false
      - name: Verify
        uses: ./.github/actions/studio-verify
        with:
          environment: dev
      - name: Build and deploy
        id: deploy
        uses: ./.github/actions/studio-deploy
        with:
          environment: dev
          sourcemap-url-prefix: https://dev.studio.harperfabric.com/assets
          # This literal, not the dispatch input, is what the CM runs — .github/deploying.md.
          harper-version: ${{ inputs.harper_version || 'v5' }}
          restart: ${{ inputs.restart || false }}
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
          cli-target-username: ${{ secrets.CLI_TARGET_USERNAME_DEV }}
          cli-target-password: ${{ secrets.HARPERDB_CLI_TARGET_PASSWORD_DEV }}
          cli-deploy-target: ${{ secrets.CLI_DEPLOY_TARGET_DEV }}

  # Its own job so its own runner: e2e code never shares a machine with the deploy credentials.
  e2e:
    name: E2E against Dev
    needs: deployToDev
    runs-on: ubuntu-latest
    # Install, up to 10 min for the build to go live, and the suite's own 25-minute global timeout.
    timeout-minutes: 40
    environment: e2e-dev
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run e2e against the deployed build
        uses: ./.github/actions/studio-e2e
        with:
          environment: dev
          base-url: https://dev.studio.harperfabric.com
          expected-version: ${{ needs.deployToDev.outputs.version }}
          user-email: ${{ secrets.PLAYWRIGHT_USER_EMAIL }}
          user-password: ${{ secrets.PLAYWRIGHT_USER_PASSWORD }}
          org-id: ${{ secrets.PLAYWRIGHT_ORG_ID }}
          mailosaur-api-key: ${{ secrets.MAILOSAUR_API_KEY }}
          mailosaur-server-id: ${{ secrets.MAILOSAUR_SERVER_ID }}
