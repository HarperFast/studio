name: Verify PR
on:
  workflow_dispatch:
  pull_request:
    branches: [dev, stage, prod]
permissions:
  contents: read
  # Lets the coverage step post/update its sticky PR comment.
  pull-requests: write
jobs:
  verifyPR:
    name: Verify PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          node-version-file: '.nvmrc'
      - name: Disable Husky
        run: echo "HUSKY=0" >> $GITHUB_ENV
      - name: Install dependencies
        run: pnpm install
      # Whole-app type-check: vitest only type-checks what tests import, so a
      # cross-feature break (e.g. an import of a symbol another in-flight PR
      # deleted) can pass tests and reach stage via the merge queue. tsc -b
      # sees the merged combination.
      - name: Type-check
        run: pnpm exec tsc -b
      - name: Run unit tests
        run: pnpm test:coverage
      - name: Report coverage
        # Runs on test failure too — coverage is still written thanks to
        # reportOnFailure in vitest.config.ts.
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
      - name: Run lint
        run: pnpm lint
      - name: Build
        run: pnpm build
