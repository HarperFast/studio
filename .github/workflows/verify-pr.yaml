name: Verify PR
on:
  workflow_dispatch:
  pull_request:
    branches: [dev, stage, prod]
permissions:
  contents: read
  # Lets the coverage step post/update its sticky PR comment.
  pull-requests: write
jobs:
  verifyPR:
    name: Verify PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          node-version-file: '.nvmrc'
      - name: Disable Husky
        run: echo "HUSKY=0" >> $GITHUB_ENV
      - name: Install dependencies
        run: pnpm install
      # Whole-app type-check: vitest only type-checks what tests import, so a
      # cross-feature break (e.g. an import of a symbol another in-flight PR
      # deleted) can pass tests and reach stage via the merge queue. tsc -b
      # sees the merged combination.
      - name: Type-check
        run: pnpm exec tsc -b
      - name: Run unit tests
        run: pnpm test:coverage
      - name: Report coverage
        # Runs on test failure too — coverage is still written thanks to
        # reportOnFailure in vitest.config.ts.
        if: always()
        uses: davelosert/vitest-coverage-report-action@3c054a2d2e2ca45446417ad5d6d5eb33092af8f1 # v2.12.1
      - name: Run lint
        run: pnpm lint
      - name: Build
        run: pnpm build
