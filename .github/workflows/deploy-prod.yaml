name: Deploy to Prod
on:
  push:
    branches:
      - prod

concurrency:
  group: prod
  cancel-in-progress: false

jobs:
  deployToProd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          node-version-file: '.nvmrc'
      - name: Disable Husky
        run: echo "HUSKY=0" >> $GITHUB_ENV
      - name: Install dependencies
        run: pnpm install
      - name: Run unit tests
        run: pnpm test
      - name: Run lint
        run: pnpm lint
      - name: Determine version tag for build
        run: |
          VERSION_TAG=$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1)
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="prod_${GITHUB_SHA:0:7}"
          fi
          echo "VITE_STUDIO_VERSION=$VERSION_TAG" >> $GITHUB_ENV
      - name: Build prod
        run: pnpm build:prod
      - name: Deploy to prod
        run: |
          mkdir deploy
          mv web deploy/
          cp -R deploy-template/* deploy/
          cd deploy
          CLI_TARGET_USERNAME=${{ secrets.CLI_TARGET_USERNAME_PROD }} CLI_TARGET_PASSWORD='${{ secrets.HARPERDB_CLI_TARGET_PASSWORD_PROD }}' pnpm harperdb deploy_component project=hdbms target='${{ secrets.CLI_DEPLOY_TARGET_PROD }}' restart=false replicated=true
