name: Deploy to Prod
on:
  # Pushes to `prod` deploy with the defaults below (Harper 4.x, no restart). Use the
  # manual run to override either — see .github/deploying.md.
  workflow_dispatch:
    inputs:
      restart:
        description: 'Restart the component after deploying'
        type: boolean
        default: false
      harper_version:
        description: 'Harper major version running on the target CM'
        type: choice
        default: v4
        options:
          - v4
          - v5
  push:
    branches:
      - prod

concurrency:
  group: prod
  cancel-in-progress: false

jobs:
  deployToProd:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      # Everything past the checkout is shared with the other environments — see
      # .github/actions/deploy-studio/action.yaml.
      - name: Build and deploy
        uses: ./.github/actions/deploy-studio
        with:
          environment: prod
          sourcemap-url-prefix: https://fabric.harper.fast/assets
          # `inputs.*` is empty outside a manual run, which lands on the action's defaults.
          restart: ${{ inputs.restart }}
          harper-version: ${{ inputs.harper_version }}
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
          cli-target-username: ${{ secrets.CLI_TARGET_USERNAME_PROD }}
          cli-target-password: ${{ secrets.HARPERDB_CLI_TARGET_PASSWORD_PROD }}
          cli-deploy-target: ${{ secrets.CLI_DEPLOY_TARGET_PROD }}
