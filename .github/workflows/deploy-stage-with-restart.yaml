name: Deploy to Stage with Restart
on:
  workflow_dispatch:

concurrency:
  group: stage-with-restart
  cancel-in-progress: false

jobs:
  deployToStage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up pnpm
        uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          node-version-file: '.nvmrc'
      - name: Disable Husky
        run: echo "HUSKY=0" >> $GITHUB_ENV
      - name: Install dependencies
        run: pnpm install
      - name: Run unit tests
        run: pnpm test
      - name: Run lint
        run: pnpm lint
      - name: Verify stage can build
        run: pnpm build:stage
      - name: Determine version tag for build
        run: |
          VERSION_TAG=$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1)
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="stage_${GITHUB_SHA:0:7}"
          fi
          echo "VITE_STUDIO_VERSION=$VERSION_TAG" >> $GITHUB_ENV
      - name: Build stage for release
        run: pnpm build:stage
      - name: Upload sourcemaps to Datadog
        run: |
          pnpm datadog-ci sourcemaps upload web/assets \
            --service "studio" \
            --release-version "$VITE_STUDIO_VERSION" \
            --minified-path-prefix "https://stage.studio.harperfabric.com/assets"
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
      - name: Deploy to stage
        run: |
          mkdir deploy
          mv web deploy/
          cp -R deploy-template/* deploy/
          cd deploy
          CLI_TARGET_USERNAME=${{ secrets.CLI_TARGET_USERNAME }} CLI_TARGET_PASSWORD='${{ secrets.HARPERDB_CLI_TARGET_PASSWORD }}' pnpm harperdb deploy_component project=hdbms target='${{ secrets.CLI_DEPLOY_TARGET }}' restart=rolling replicated=true
