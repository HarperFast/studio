name: Verify Stage Merge Group
on:
  merge_group:
    branches:
      - stage

concurrency:
  # Per merge-group ref, and cancellable: a superseded batch is disposable, unlike a deploy.
  group: stage-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifyMergeGroup:
    # `Verify Stage` is the check name to require on the merge queue.
    name: Verify Stage
    runs-on: ubuntu-latest
    # A merge-group run executes the candidate PR's own workflow and action YAML. Nothing here
    # may hold a credential, which is why this is a separate workflow from the deploy one and
    # why `.github/actions/studio-verify` takes no credential inputs. See .github/deploying.md.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `build` is what makes this a queue check rather than a second per-PR run: the `build`
      # script is `tsc -b && vite build`, so this type-checks the *merged* ref. Two PRs that are
      # each green can still fail combined — see .github/deploying.md.
      - name: Verify
        uses: ./.github/actions/studio-verify
        with:
          environment: stage
          build: 'true'
