name: Deploy to Dev with Restart
on:
  workflow_dispatch:

concurrency:
  group: dev
  cancel-in-progress: false

jobs:
  deployToDev:
    name: Deploy to Dev with Restart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          node-version-file: '.nvmrc'
      - name: Disable Husky
        run: echo "HUSKY=0" >> $GITHUB_ENV
      - name: Install dependencies
        run: pnpm install
      - name: Run unit tests
        run: pnpm test
      - name: Run lint
        run: pnpm lint
      - name: Determine version tag for build
        run: |
          VERSION_TAG=$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1)
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="dev_${GITHUB_SHA:0:7}"
          fi
          echo "VITE_STUDIO_VERSION=$VERSION_TAG" >> $GITHUB_ENV
      - name: Build dev
        run: pnpm build --mode dev
      - name: Upload sourcemaps to Datadog
        run: |
          pnpm datadog-ci sourcemaps upload web/assets \
            --service "studio" \
            --release-version "$VITE_STUDIO_VERSION" \
            --minified-path-prefix "https://dev.studio.harperfabric.com/assets"
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
      # Datadog now holds the maps and is their only consumer. They are 76% of the build output
      # (~71 MB, mostly `sourcesContent`), so shipping them too would replicate that to every
      # node for nothing. See `sourcemapFor` in vite.config.ts, which emits these as `'hidden'`
      # so no bundle references the files deleted here.
      - name: Strip sourcemaps from the deployed bundle
        run: find web/assets -name '*.js.map' -delete
      - name: Deploy to dev
        run: |
          mkdir deploy
          mv web deploy/
          cp -R .github/deploy-template/* deploy/
          cd deploy
          CLI_TARGET_USERNAME=${{ secrets.CLI_TARGET_USERNAME_DEV }} CLI_TARGET_PASSWORD='${{ secrets.HARPERDB_CLI_TARGET_PASSWORD_DEV }}' pnpm harper deploy_component project=hdbms target='${{ secrets.CLI_DEPLOY_TARGET_DEV }}' restart=true replicated=true
