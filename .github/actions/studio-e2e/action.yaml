name: Studio e2e
description: Wait until an environment serves the build just deployed, then run e2e/ against it and fail on red.

# The caller must check out the commit it deployed: another commit's specs against this deployment
# fail for reasons that are not regressions. Never pass this action a deploy credential.
inputs:
  environment:
    description: 'dev | stage | prod — labels the report'
    required: true
  base-url:
    description: 'Origin of the deployed Studio under test'
    required: true
  expected-version:
    description: 'The VITE_STUDIO_VERSION the deploy baked in (studio-deploy output `version`)'
    required: true
  version-timeout-seconds:
    description: 'How long to wait for base-url to serve expected-version before failing'
    default: '600'
  grep-invert:
    description: 'Playwright --grep-invert. @visual baselines come from the Debian container, not this runner'
    default: '@visual'
  project:
    description: 'Restrict to one Playwright project (setup | authed | anon); empty runs all of them'
    default: ''
  user-email:
    description: 'Disposable test account for the setup and authed projects'
    default: ''
  user-password:
    description: 'Password of the disposable test account'
    default: ''
  org-id:
    description: 'Organization the authed specs visit; derived from the post-login landing when empty'
    default: ''
  mailosaur-api-key:
    description: 'Mailosaur key for the signup round-trip (@roundtrip)'
    default: ''
  mailosaur-server-id:
    description: 'Mailosaur server for the signup round-trip (@roundtrip)'
    default: ''

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        cache: 'pnpm'
        cache-dependency-path: 'e2e/pnpm-lock.yaml'
        node-version-file: '.nvmrc'
    - name: Install e2e dependencies
      shell: bash
      working-directory: e2e
      run: pnpm install --frozen-lockfile
    - name: Install Chromium
      shell: bash
      working-directory: e2e
      run: pnpm exec playwright install --with-deps --only-shell chromium
    - name: Wait for ${{ inputs.expected-version }} on ${{ inputs.environment }}
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
        EXPECTED_VERSION: ${{ inputs.expected-version }}
        TIMEOUT_SECONDS: ${{ inputs.version-timeout-seconds }}
      run: node "$GITHUB_ACTION_PATH/postDeploy.ts" wait
    - name: Run e2e against ${{ inputs.environment }}
      id: playwright
      shell: bash
      working-directory: e2e
      env:
        PLAYWRIGHT_BASE_URL: ${{ inputs.base-url }}
        PLAYWRIGHT_USER_EMAIL: ${{ inputs.user-email }}
        PLAYWRIGHT_USER_PASSWORD: ${{ inputs.user-password }}
        PLAYWRIGHT_ORG_ID: ${{ inputs.org-id }}
        MAILOSAUR_API_KEY: ${{ inputs.mailosaur-api-key }}
        MAILOSAUR_SERVER_ID: ${{ inputs.mailosaur-server-id }}
        GREP_INVERT: ${{ inputs.grep-invert }}
        PROJECT: ${{ inputs.project }}
      run: |
        set +e
        pnpm exec playwright test --max-failures=10 --global-timeout=1500000 \
          ${GREP_INVERT:+--grep-invert="$GREP_INVERT"} ${PROJECT:+--project="$PROJECT"}
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"
    - name: Report
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        BASE_URL: ${{ inputs.base-url }}
        EXPECTED_VERSION: ${{ inputs.expected-version }}
        GREP_INVERT: ${{ inputs.grep-invert }}
        PROJECT: ${{ inputs.project }}
        PLAYWRIGHT_EXIT: ${{ steps.playwright.outputs.exit-code }}
        RESULTS_FILE: e2e/results/results.json
        PLAYWRIGHT_USER_EMAIL: ${{ inputs.user-email }}
        PLAYWRIGHT_USER_PASSWORD: ${{ inputs.user-password }}
        PLAYWRIGHT_ORG_ID: ${{ inputs.org-id }}
        MAILOSAUR_API_KEY: ${{ inputs.mailosaur-api-key }}
        MAILOSAUR_SERVER_ID: ${{ inputs.mailosaur-server-id }}
      run: node "$GITHUB_ACTION_PATH/postDeploy.ts" report
