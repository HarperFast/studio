name: Verify Studio
description: Install, test, lint and optionally build Studio. Takes no credentials.

# Deliberately secret-free, and deliberately separate from studio-deploy: `pnpm install` alone
# runs postinstall scripts from whatever ref is checked out, so the installing side must never
# hold a credential. No deploy workflow accepts `merge_group` any more (studio#1649), but keep
# this side credential-free regardless — that is what makes the separation worth having.
inputs:
  environment:
    description: 'dev | stage | prod — the vite mode to build'
    required: true
  build:
    description: 'Also build the bundle, for runs where nothing later will'
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'
        node-version-file: '.nvmrc'
    - name: Disable Husky
      shell: bash
      run: echo "HUSKY=0" >> "$GITHUB_ENV"
    - name: Install dependencies
      shell: bash
      run: pnpm install
    - name: Run unit tests
      shell: bash
      run: pnpm test
    - name: Run lint
      shell: bash
      run: pnpm lint
    # A releasing run must fail before `pnpm release` tags a version nothing can ship. A plain
    # deploy skips it: the real build follows.
    - name: Verify ${{ inputs.environment }} can build
      if: ${{ inputs.build == 'true' }}
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: pnpm build --mode "$ENVIRONMENT"
