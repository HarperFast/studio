name: Verify Studio
description: Install, test, lint and optionally build Studio. Takes no credentials.

# Deliberately secret-free, and deliberately separate from studio-deploy. A `merge_group` run
# executes this from the merge-group ref, which contains the candidate PR's code — including any
# edit to this file — so nothing here may be handed a token. `pnpm install` alone is enough to
# run PR-controlled postinstall scripts. studio-deploy holds every credentialed step and the
# callers skip it outright on a merge-queue run.
inputs:
  environment:
    description: 'dev | stage | prod — the vite mode to build'
    required: true
  build:
    description: 'Also build the bundle, for runs where nothing later will'
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'
        node-version-file: '.nvmrc'
    - name: Disable Husky
      shell: bash
      run: echo "HUSKY=0" >> "$GITHUB_ENV"
    - name: Install dependencies
      shell: bash
      run: pnpm install
    - name: Run unit tests
      shell: bash
      run: pnpm test
    - name: Run lint
      shell: bash
      run: pnpm lint
    # A merge-queue run has no later build to catch a break, and a releasing run must fail before
    # `pnpm release` tags a version nothing can ship. A plain deploy skips it: the real build follows.
    - name: Verify ${{ inputs.environment }} can build
      if: ${{ inputs.build == 'true' }}
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: pnpm build --mode "$ENVIRONMENT"
