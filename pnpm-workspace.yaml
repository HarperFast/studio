allowBuilds:
  '@datadog/pprof': true
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  argon2: true
  bufferutil: true
  cbor-extract: true
  core-js-pure: true
  dprint: true
  esbuild: true
  lmdb: false
  msgpackr-extract: true
  reo-census: true
  segfault-handler: true
  tree-sitter: true
  tree-sitter-json: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - '@harperfast/agent-tools@1.2.0'
  - '@harperfast/skills@1.10.0'
  - create-harper@1.9.0
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - core-js-pure
  - dprint
  - esbuild
  - reo-census
overrides:
  # Force patched versions of stale transitive deps flagged by Dependabot.
  # All are transitive-only; bumping the minimum clears the advisories.
  handlebars: '^4.7.9'
  'undici@>=7.0.0': '^7.28.0'
  lodash-es: '^4.18.1'
  form-data: '^4.0.6'
  dompurify: '^3.4.11'
  js-yaml: '^4.2.0'
  mdast-util-to-hast: '^13.2.1'
