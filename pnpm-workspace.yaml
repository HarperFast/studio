allowBuilds:
  '@datadog/pprof': true
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  argon2: true
  bufferutil: true
  cbor-extract: true
  core-js-pure: true
  dprint: true
  esbuild: true
  lmdb: false
  msgpackr-extract: true
  reo-census: true
  segfault-handler: true
  tree-sitter: true
  tree-sitter-json: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - '@harperfast/agent-tools@1.2.0'
  - '@harperfast/skills@1.10.0'
  - create-harper@1.9.0
  - harper@5.1.7
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - core-js-pure
  - dprint
  - esbuild
  - reo-census
overrides:
  # Force patched versions of stale transitive deps flagged by Dependabot.
  # All are transitive-only; bumping the minimum clears the advisories.
  handlebars: '^4.7.9'
  'undici@>=7.0.0': '^8.0.0'
  # jsdom (incl. latest 29.x) requires undici ^7.25.0 and imports the internal
  # undici/lib/handler/wrap-handler.js, which undici 8 removed. Keep jsdom on
  # undici 7.x until a jsdom release supports undici 8, otherwise its tests crash
  # with "Cannot find module 'undici/lib/handler/wrap-handler.js'".
  'jsdom>undici': '^7.28.0'
  # undici 6.x comes in via semantic-release's @actions/http-client (^6.23.0).
  'undici@<6.27.0': '^8.0.0'
  lodash-es: '^4.18.1'
  form-data: '^4.0.6'
  dompurify: '^3.4.11'
  js-yaml: '^4.2.0'
  mdast-util-to-hast: '^13.2.1'
