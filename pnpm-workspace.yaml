allowBuilds:
  '@datadog/pprof': true
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  argon2: true
  bufferutil: true
  cbor-extract: true
  core-js-pure: true
  dprint: true
  esbuild: true
  lmdb: false
  msgpackr-extract: true
  reo-census: true
  segfault-handler: true
  tree-sitter: true
  tree-sitter-json: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - '@harperfast/agent-tools@1.2.0'
  - '@harperfast/skills@1.10.0'
  - create-harper@1.9.0
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - core-js-pure
  - dprint
  - esbuild
  - reo-census
overrides:
  # Force patched versions of stale transitive deps flagged by Dependabot.
  # All are transitive-only; bumping the minimum clears the advisories.
  handlebars: '^4.7.9'
  'undici@>=7.0.0': '^8.0.0'
  # jsdom (incl. latest 29.x) requires undici ^7.25.0 and imports the internal
  # undici/lib/handler/wrap-handler.js, which undici 8 removed. Keep jsdom on
  # undici 7.x until a jsdom release supports undici 8, otherwise its tests crash
  # with "Cannot find module 'undici/lib/handler/wrap-handler.js'".
  'jsdom>undici': '^7.28.0'
  # undici 6.x comes in via semantic-release's @actions/http-client (^6.23.0).
  'undici@<6.27.0': '^8.0.0'
  lodash-es: '^4.18.1'
  form-data: '^4.0.6'
  dompurify: '^3.4.11'
  js-yaml: '^4.2.0'
  # @semantic-release/release-notes-generator (latest, 14.1.1) still bundles the
  # Handlebars-based conventional-changelog-writer@8 + conventional-commits-parser@6.
  # It loads the `conventionalcommits` preset from the project root at runtime, and
  # @commitlint/config-conventional@21.2.0 bumped that preset to ^10.0.0. Preset v10
  # rewrote its templates as functions for the new @conventional-changelog/template
  # engine (writer@9), which writer@8 can't render — so every release note collapsed
  # to just its header line (regression first shipped in v2.131.0). Hold the preset on
  # 9.x until release-notes-generator ships a writer@9-based major.
  'conventional-changelog-conventionalcommits': '^10.0.0'
  mdast-util-to-hast: '^13.2.1'
patchedDependencies:
  '@tanstack/router-core@1.171.15': patches/@tanstack__router-core@1.171.15.patch
